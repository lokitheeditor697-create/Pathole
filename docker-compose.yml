version: '3.8'

services:
  smart-city-road-defect:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-city-road-defect:latest
    container_name: road_defect_detector
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7860/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
