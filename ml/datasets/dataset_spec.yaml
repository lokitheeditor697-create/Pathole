# YOLOv8 Dataset Specification for Road Intelligence Phase 1
path: ml/datasets/road_defect_data
train: images/train
val: images/val
test: images/test

# 7 Phase 1 Classes
names:
  0: pothole
  1: longitudinal_crack
  2: transverse_crack
  3: alligator_crack
  4: road_patch
  5: rutting
  6: waterlogging

# Data sources:
# 1. RDD2022 (Road Damage Dataset - India / Japan subset)
# 2. Chennai Municipal Dashcam Footage (MTC 46G, MTC 15G patrol frames)
# 3. Route-based splitting to prevent frame-leakage between train and validation.
metadata:
  total_annotated_images: 6420
  train_split: 5136
  val_split: 642
  test_split: 642
  negative_background_samples_ratio: 0.12 # Clean asphalt / shadow patches
