services:
  - type: web
    name: road-pothole-intelligence
    runtime: node
    plan: free
    buildCommand: npm install && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir ultralytics opencv-python-headless numpy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: YOLO_OFFLINE
        value: "True"
      - key: ULTRALYTICS_AUTOINSTALL
        value: "0"
