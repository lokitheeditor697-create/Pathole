services:
  - type: web
    name: road-pothole-intelligence
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALERT_TRIGGER_CRITERIA
        value: MULTI_BUS_VERIFIED
